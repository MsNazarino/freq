<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZKP Adhoc Dashboard</title>
<style>
:root{
  --lime:#c8e38a; --lime-2:#b9d877; --green:#5dbb77; --green-fade:rgba(93,187,119,.28);
  --kpi:#62b552; --ink:#2b2b2b; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f6f2; --card:#fff;
  --warn:#b45309; --err:#b91c1c; --info:#1d4ed8;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);font-size:14px}
button,select,input{font:inherit}
#app{display:flex;flex-direction:column;min-height:100vh}
.topbar{display:flex;align-items:center;gap:16px;background:var(--lime);padding:10px 18px;min-height:64px}
.brand{font-size:22px;width:210px;display:flex;align-items:baseline;gap:8px}
.ver{font-size:11px;color:#3f5f1f;cursor:pointer;text-decoration:underline dotted}
.topbar h1{flex:1;margin:0;font-weight:400;font-size:26px;text-align:center}
.actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.asof{font-size:12px;color:#3f5f1f;margin-right:6px;white-space:nowrap}
.btn{border:1px solid #9fbf5c;background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f3f9e6}
.btn.primary{background:#3f8f4f;color:#fff;border-color:#3f8f4f;font-weight:600}
.btn.primary:hover{background:#357a43}
.btn:disabled{opacity:.6;cursor:wait}
.sel{border:1px solid #9fbf5c;border-radius:8px;padding:5px 6px;background:#fff;max-width:230px}
.layout{display:flex;flex:1;min-height:0}
.sidebar{width:228px;background:var(--lime);padding:14px 12px;display:flex;flex-direction:column;gap:14px}
.slicer{border:3px solid #fff;border-radius:16px;padding:10px 10px 8px}
.slicer-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.slicer-title{font-size:16px}
.slicer-clear{font-size:11px;color:#3f5f1f;cursor:pointer;text-decoration:underline;visibility:hidden}
.slicer.active .slicer-clear{visibility:visible}
.slicer-list{max-height:220px;overflow:auto;padding-right:4px}
.sl-item{display:flex;align-items:center;gap:10px;padding:4px 2px;cursor:pointer;font-size:15px}
.sl-item input{width:17px;height:17px;accent-color:#222;margin:0;cursor:pointer}
.sl-empty{font-size:12px;color:#4b5f2b}
.sidebar .btn{width:100%}
main{flex:1;padding:16px 18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.banner{border-radius:10px;padding:10px 14px;font-size:13px;display:none}
.banner.show{display:block}
.banner.info{background:#eef6e3;border:1px solid #c5e0a0}
.banner.error{background:#fdecec;border:1px solid #f3b4b4;color:var(--err)}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-height:0}
.chip{background:#fff;border:1px solid #cfe3a8;border-radius:999px;padding:3px 10px;font-size:12px;display:flex;gap:6px;align-items:center}
.chip b{font-weight:600}
.chip .x{cursor:pointer;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:16px 10px 14px;text-align:center;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.kpi-title{font-size:17px;color:#333}
.kpi-val{font-size:48px;line-height:1.1;color:var(--kpi);font-weight:500;letter-spacing:.5px}
.kpi-delta{font-size:20px;color:var(--kpi);min-height:26px}
.kpi-cmp{font-size:12px;color:var(--muted);min-height:16px}
.kpi-cmp .up{color:#15803d}.kpi-cmp .down{color:var(--err)}
.grid{display:grid;grid-template-columns:1.15fr 1fr;grid-template-rows:minmax(260px,1fr) minmax(260px,1fr);grid-template-areas:"bank income" "pilot income";gap:14px;flex:1;min-height:560px}
.card{background:var(--card);border-radius:16px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:12px 14px;display:flex;flex-direction:column;min-height:0}
.card h3{margin:0 0 6px;font-size:13px;font-weight:600;color:#444}
.card .hint{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.chart-wrap{position:relative;flex:1;min-height:0}
#cardBank{grid-area:bank}#cardPilot{grid-area:pilot}#cardIncome{grid-area:income}
.busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:50;font-size:16px}
.busy.show{display:flex}
.spinner{width:28px;height:28px;border:3px solid #c8e38a;border-top-color:#3f8f4f;border-radius:50%;animation:spin 1s linear infinite;margin-right:10px}
@keyframes spin{to{transform:rotate(360deg)}}
dialog{border:none;border-radius:14px;padding:0;width:min(980px,94vw);max-height:88vh;box-shadow:0 10px 40px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(0,0,0,.3)}
.dlg-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--lime)}
.dlg-head h2{margin:0;font-size:18px;font-weight:500}
.dlg-body{padding:14px 18px;overflow:auto;max-height:calc(88vh - 120px)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 18px;border-top:1px solid var(--line)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:6px 12px;border-radius:8px;cursor:pointer;border:1px solid var(--line);background:#fff}
.tab.on{background:#3f8f4f;color:#fff;border-color:#3f8f4f}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{background:#f7faf2;font-weight:600}
table.t td.num{text-align:right;white-space:nowrap}
.st-ok{color:#15803d;font-weight:600}.st-error{color:var(--err);font-weight:600}.st-nochange{color:var(--muted)}
.w{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:13px}
.w.error{background:#fdecec;color:var(--err)}.w.warn{background:#fff6e5;color:var(--warn)}.w.info{background:#eef3fe;color:var(--info)}.w.ok{background:#eef6e3;color:#2f6b1f}
.ver-item{margin-bottom:14px}.ver-item h4{margin:0 0 4px;font-size:14px}.ver-item ul{margin:0;padding-left:20px}
.form-row{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center;margin:8px 0}
.form-row input[type=text],.form-row select,.form-row input[type=month]{padding:6px 8px;border:1px solid #cbd5e1;border-radius:8px;width:100%}
.sec{font-weight:600;margin:16px 0 6px;font-size:14px}
.folders{display:flex;flex-direction:column;gap:4px;margin-bottom:8px}
.folder{background:#f7faf2;border:1px solid #dbe9c2;border-radius:8px;padding:5px 10px;font-family:Consolas,monospace;font-size:12.5px}
.muted{color:var(--muted);font-size:12px}
.mt{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.mt div{background:#f7faf2;border-radius:8px;padding:6px 8px;font-size:12px}
.mt div b{display:block;font-size:14px}
.mt div.cur{outline:2px solid #3f8f4f}
#printArea{display:none}
@media (max-width:1200px){.kpi-val{font-size:36px}.brand{width:auto}}
@media print{
  @page{size:A4 landscape;margin:6mm}
  body{background:#fff}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:100%;height:auto}
}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span data-i18n="brand">Дашборд</span><span class="ver" id="verLink" data-noexport></span></div>
    <h1>ZKP Adhoc Dashboard</h1>
    <div class="actions" data-noexport>
      <span class="asof" id="asOf"></span>
      <button class="btn primary" id="btnRefresh">⟳ <span data-i18n="refresh">Оновити</span></button>
      <select class="sel" id="compareSel" title=""></select>
      <button class="btn" id="btnPng">PNG</button>
      <button class="btn" id="btnPdf">PDF</button>
      <button class="btn" id="btnData" data-i18n="data">Дані</button>
      <button class="btn" id="btnLog" data-i18n="log">Журнал</button>
      <button class="btn" id="btnSettings" data-i18n-title="settings">⚙</button>
      <button class="btn" id="btnLang">EN</button>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar">
      <div class="slicer" id="slPilot" data-dim="pilot">
        <div class="slicer-head"><span class="slicer-title" data-i18n="pilotMonth">Pilot Month</span><span class="slicer-clear" data-noexport data-i18n="clear">очистити</span></div>
        <div class="slicer-list"></div>
      </div>
      <div class="slicer" id="slIncome" data-dim="income">
        <div class="slicer-head"><span class="slicer-title" data-i18n="incomeDate">Income Date</span><span class="slicer-clear" data-noexport data-i18n="clear">очистити</span></div>
        <div class="slicer-list"></div>
      </div>
      <div class="slicer" id="slBank" data-dim="bank">
        <div class="slicer-head"><span class="slicer-title" data-i18n="bank">Bank</span><span class="slicer-clear" data-noexport data-i18n="clear">очистити</span></div>
        <div class="slicer-list"></div>
      </div>
      <button class="btn" id="btnReset" data-noexport data-i18n="resetFilters">Скинути фільтри</button>
    </aside>
    <main>
      <div class="banner" id="banner"></div>
      <div class="chips" id="chips"></div>
      <section class="kpis">
        <div class="kpi" id="kPot"><div class="kpi-title" data-i18n="kPot"></div><div class="kpi-val">–</div><div class="kpi-delta"></div><div class="kpi-cmp"></div></div>
        <div class="kpi" id="kEng"><div class="kpi-title" data-i18n="kEng"></div><div class="kpi-val">–</div><div class="kpi-delta"></div><div class="kpi-cmp"></div></div>
        <div class="kpi" id="kInc"><div class="kpi-title" data-i18n="kInc"></div><div class="kpi-val">–</div><div class="kpi-delta"></div><div class="kpi-cmp"></div></div>
        <div class="kpi" id="kCards"><div class="kpi-title" data-i18n="kCards"></div><div class="kpi-val">–</div><div class="kpi-delta"></div><div class="kpi-cmp"></div></div>
        <div class="kpi" id="kConv"><div class="kpi-title" data-i18n="kConv"></div><div class="kpi-val">–</div><div class="kpi-delta"></div><div class="kpi-cmp"></div></div>
      </section>
      <section class="grid">
        <div class="card" id="cardBank"><h3><span data-i18n="chBank"></span><span class="hint" data-i18n="clickHint" data-noexport></span></h3><div class="chart-wrap"><canvas id="chBank"></canvas></div></div>
        <div class="card" id="cardPilot"><h3><span data-i18n="chPilot"></span><span class="hint" data-i18n="clickHint" data-noexport></span></h3><div class="chart-wrap"><canvas id="chPilot"></canvas></div></div>
        <div class="card" id="cardIncome"><h3><span data-i18n="chIncome"></span><span class="hint" data-i18n="clickHint" data-noexport></span></h3><div class="chart-wrap"><canvas id="chIncome"></canvas></div></div>
      </section>
    </main>
  </div>
</div>

<div class="busy" id="busy"><div class="spinner"></div><span data-i18n="loading">Читаю файли…</span></div>
<dialog id="dlg"><div class="dlg-head"><h2 id="dlgTitle"></h2><button class="btn" id="dlgX">✕</button></div><div class="dlg-body" id="dlgBody"></div><div class="dlg-foot" id="dlgFoot"></div></dialog>
<input type="file" id="dirInput" webkitdirectory multiple hidden>
<div id="printArea"><img id="printImg" alt=""></div>

/* ======================= STORAGE ======================= */
const KV = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    try { const r = indexedDB.open('zkp-dashboard', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    } catch (e) { rej(e); }
  }));
  async function get(k){
    try { const db = await open();
      return await new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e) { try { const v = localStorage.getItem('zkp:' + k); return v ? JSON.parse(v) : undefined; } catch (_) { return undefined; } }
  }
  async function set(k, v){
    try { const db = await open();
      await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
    } catch (e) { try { localStorage.setItem('zkp:' + k, JSON.stringify(v)); } catch (_) {} }
  }
  return { get, set };
})();

/* ======================= FORMAT ======================= */
function fmtCompact(v){
  if (v == null || isNaN(v)) return '–';
  const a = Math.abs(v); let x = v, suf = '';
  if (a >= 1e9){ x = v/1e9; suf = 'B'; } else if (a >= 1e6){ x = v/1e6; suf = 'M'; } else if (a >= 1e3){ x = v/1e3; suf = 'K'; }
  else return v.toLocaleString(loc(), { maximumFractionDigits: 0 });
  return x.toLocaleString(loc(), { maximumSignificantDigits: 3 }) + suf;
}
const fmtInt = v => (v == null || isNaN(v)) ? '–' : Math.round(v).toLocaleString(loc());
const fmtNum = (v, d=2) => (v == null || isNaN(v)) ? '–' : v.toLocaleString(loc(), { maximumFractionDigits: d });
const fmtPct = v => (v == null || isNaN(v)) ? '–' : (v*100).toLocaleString(loc(), { minimumFractionDigits:2, maximumFractionDigits:2 }) + '%';
const sign = v => v > 0 ? '+' : (v < 0 ? '−' : '±');
const fmtDT = ts => new Date(ts).toLocaleString(loc(), { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
const fmtSize = b => b >= 1048576 ? (b/1048576).toLocaleString(loc(), {maximumFractionDigits:1}) + ' MB' : Math.max(1, Math.round(b/1024)).toLocaleString(loc()) + ' KB';

/* ======================= PARSING ======================= */
function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const nl = text.indexOf('\n'); const first = nl >= 0 ? text.slice(0, nl) : text;
  const cnt = ch => first.split(ch).length - 1;
  const d = cnt(';') > cnt(',') ? ';' : (cnt('\t') > cnt(',') ? '\t' : ',');
  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++){
    const c = text[i];
    if (q){
      if (c === '"'){ if (text[i+1] === '"'){ f += '"'; i++; } else q = false; }
      else f += c;
    } else if (c === '"') q = true;
    else if (c === d){ row.push(f); f = ''; }
    else if (c === '\n'){ row.push(f.endsWith('\r') ? f.slice(0,-1) : f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length){ row.push(f.endsWith('\r') ? f.slice(0,-1) : f); rows.push(row); }
  const header = (rows.shift() || []).map(h => h.trim());
  return { header, rows: rows.filter(r => r.length > 1 || (r[0] || '').trim() !== '') };
}
function table(text, required){
  const { header, rows } = parseCSV(text);
  const idx = {}; header.forEach((h, i) => idx[h.toLowerCase()] = i);
  const missing = required.filter(c => !(c.toLowerCase() in idx));
  const get = (r, c) => { const i = idx[c.toLowerCase()]; return i == null ? '' : (r[i] ?? '').trim(); };
  return { rows, missing, get, header };
}
function normId(s){
  s = (s || '').trim(); if (!s) return '';
  if (/^-?\d+(\.0+)?$/.test(s)) return String(parseInt(s, 10));
  if (/^\d+(\.\d+)?e\+?\d+$/i.test(s)) return String(Math.round(Number(s)));
  return s;
}
function toNum(s){
  s = (s || '').trim().replace(/[\s\u00a0]/g, ''); if (!s) return 0;
  if (s.includes(',') && s.includes('.')) s = s.replace(/,/g, ''); else s = s.replace(',', '.');
  const v = Number(s); return isNaN(v) ? NaN : v;
}
function toMonth(s){
  s = (s || '').trim(); if (!s) return '';
  let m = s.match(/^(\d{4})[-_/.](\d{1,2})/); if (m) return m[1] + '_' + m[2].padStart(2, '0');
  m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})/); if (m) return m[3] + '_' + m[2].padStart(2, '0');
  if (/^\d{5}(\.\d+)?$/.test(s)){ const d = new Date(Date.UTC(1899, 11, 30) + Math.floor(Number(s)) * 86400000); return d.getUTCFullYear() + '_' + String(d.getUTCMonth()+1).padStart(2, '0'); }
  return null;
}
async function readText(file){
  const buf = await file.arrayBuffer();
  let s = new TextDecoder('utf-8').decode(buf);
  if (s.includes('\uFFFD')) { try { s = new TextDecoder('windows-1251').decode(buf); } catch (_) {} }
  return s;
}

/* Raw tables from file texts */
function buildRaw(texts, st){
  const errors = [];
  const keyCol = st.joinKey;
  const P = table(texts.pot, ['IDENTIFYCODE','BANK']);
  const D = table(texts.dim, ['IDENTIFYCODE','BANK','pilot_month','Cards_Count','Is_Engaged'].concat(keyCol === 'CONTRAGENTID' ? ['CONTRAGENTID'] : []));
  const F = table(texts.fact, ['Income_Date','Income_Value', keyCol]);
  if (P.missing.length) errors.push(t('missingCols', { file: st.files.pot, cols: P.missing.join(', ') }));
  if (D.missing.length) errors.push(t('missingCols', { file: st.files.dim, cols: D.missing.join(', ') }));
  if (F.missing.length) errors.push(t('missingCols', { file: st.files.fact, cols: F.missing.join(', ') }));
  if (errors.length) throw new Error(errors.join(' '));
  const raw = { pot:[], dim:[], fact:[], badPilot:0, badFact:0 };
  for (const r of P.rows) raw.pot.push({ id: normId(P.get(r,'IDENTIFYCODE')), bank: P.get(r,'BANK') });
  for (const r of D.rows){
    const pm = toMonth(D.get(r,'pilot_month')); if (pm === null) raw.badPilot++;
    const cards = toNum(D.get(r,'Cards_Count')), eng = toNum(D.get(r,'Is_Engaged'));
    raw.dim.push({ id: normId(D.get(r,'IDENTIFYCODE')), ca: normId(D.get(r,'CONTRAGENTID')), bank: D.get(r,'BANK'), pm: pm || '',
      cards: isNaN(cards) ? 0 : cards, eng: isNaN(eng) ? 0 : eng });
  }
  for (const r of F.rows){
    const m = toMonth(F.get(r,'Income_Date')), v = toNum(F.get(r,'Income_Value'));
    if (!m || isNaN(v)) { raw.badFact++; continue; }
    raw.fact.push({ id: normId(F.get(r,'IDENTIFYCODE')), ca: normId(F.get(r,'CONTRAGENTID')), m, v });
  }
  raw.rowCounts = { pot: P.rows.length, dim: D.rows.length, fact: F.rows.length };
  return raw;
}

/* Aggregated cube — everything on the page is calculated from it */
function buildCube(raw, st, files){
  const key = st.joinKey === 'CONTRAGENTID' ? 'ca' : 'id';
  const from = (st.incomeFrom || '').replace('-', '_');
  const dimMap = new Map(); let dimDup = 0;
  for (const r of raw.dim){ const k = r[key]; if (!k) continue; if (dimMap.has(k)) { dimDup++; continue; } dimMap.set(k, r); }
  const dimAgg = new Map(); let engNoPilot = 0;
  for (const r of raw.dim){
    const kk = r.bank + '|' + r.pm; let a = dimAgg.get(kk);
    if (!a){ a = { b:r.bank, p:r.pm, e:0, c:0, n:0 }; dimAgg.set(kk, a); }
    a.e += r.eng; a.c += r.cards; a.n++;
    if (r.eng > 0 && !r.pm) engNoPilot++;
  }
  const potBank = new Map(), potAll = new Set(); let potDup = 0;
  for (const r of raw.pot){
    if (!r.id) continue;
    if (potAll.has(r.id)) potDup++; potAll.add(r.id);
    if (!potBank.has(r.bank)) potBank.set(r.bank, new Set()); potBank.get(r.bank).add(r.id);
  }
  let engNotPot = 0; for (const r of raw.dim) if (r.eng > 0 && r.id && !potAll.has(r.id)) engNotPot++;
  const incAgg = new Map(); const modeTotals = { all:0, after:0, from:0, date:0 };
  let unmatched = 0, unmatchedSum = 0;
  for (const r of raw.fact){
    const d = dimMap.get(r[key]); const b = d ? d.bank : '', p = d ? d.pm : '';
    if (!d){ unmatched++; unmatchedSum += r.v; }
    const inc = { all:true, after: !!p && r.m > p, from: !!p && r.m >= p, date: !from || r.m >= from };
    for (const k in inc) if (inc[k]) modeTotals[k] += r.v;
    if (!inc[st.incomeMode]) continue;
    const kk = b + '|' + p + '|' + r.m; let a = incAgg.get(kk);
    if (!a){ a = { b, p, m:r.m, v:0 }; incAgg.set(kk, a); }
    a.v += r.v;
  }
  const warnings = [];
  if (potDup) warnings.push({ lvl:'warn', k:'w_potDup', p:{ n:potDup } });
  if (dimDup) warnings.push({ lvl:'warn', k:'w_dimDup', p:{ n:dimDup, key:st.joinKey } });
  if (engNoPilot) warnings.push({ lvl:'warn', k:'w_engNoPilot', p:{ n:engNoPilot } });
  if (raw.badPilot) warnings.push({ lvl:'warn', k:'w_badPilot', p:{ n:raw.badPilot } });
  if (unmatched) warnings.push({ lvl:'info', k:'w_factUnmatched', p:{ n:unmatched, s:Math.round(unmatchedSum) } });
  if (raw.badFact) warnings.push({ lvl:'warn', k:'w_factBad', p:{ n:raw.badFact } });
  if (engNotPot) warnings.push({ lvl:'info', k:'w_engNotPot', p:{ n:engNotPot } });
  return { v:1, builtAt: Date.now(), mode: st.incomeMode, incomeFrom: st.incomeFrom, joinKey: st.joinKey,
    dim:[...dimAgg.values()], pot:[...potBank].map(([b, s]) => ({ b, n:s.size })), potTotal: potAll.size,
    inc:[...incAgg.values()], files, warnings, modeTotals };
}

/* ======================= CALCULATIONS ======================= */
function agg(c, f, ignore){
  const okB = b => ignore === 'bank' || !f.bank.size || f.bank.has(b);
  const okP = p => ignore === 'pilot' || !f.pilot.size || f.pilot.has(p);
  const okM = m => ignore === 'income' || !f.income.size || f.income.has(m);
  let engaged = 0, cards = 0; const byPilot = new Map(), byBank = new Map(), byMonth = new Map();
  for (const r of c.dim){
    if (!okB(r.b) || !okP(r.p)) continue;
    engaged += r.e; cards += r.c;
    if (r.p){ const x = byPilot.get(r.p) || { e:0, c:0 }; x.e += r.e; x.c += r.c; byPilot.set(r.p, x); }
    byBank.set(r.b, (byBank.get(r.b) || 0) + r.e);
  }
  const pot = (ignore !== 'bank' && f.bank.size) ? c.pot.filter(r => f.bank.has(r.b)).reduce((s, r) => s + r.n, 0) : c.potTotal;
  let income = 0;
  for (const r of c.inc){
    if (!okB(r.b) || !okP(r.p) || !okM(r.m)) continue;
    income += r.v; byMonth.set(r.m, (byMonth.get(r.m) || 0) + r.v);
  }
  return { engaged, cards, pot, income, byPilot, byBank, byMonth };
}
function kpis(c, f){
  const a = agg(c, f);
  const lastP = [...a.byPilot.keys()].filter(k => a.byPilot.get(k).e > 0).sort().pop();
  const lastM = [...a.byMonth.keys()].filter(k => a.byMonth.get(k) !== 0).sort().pop();
  const lp = lastP ? a.byPilot.get(lastP) : { e:0, c:0 };
  return { pot:a.pot, engaged:a.engaged, income:a.income, cards:a.cards, conv: a.pot ? a.engaged / a.pot : null,
    d:{ engaged: lp.e, cards: lp.c, income: lastM ? a.byMonth.get(lastM) : 0, conv: a.pot ? lp.e / a.pot : 0 }, lastP, lastM };
}

const hasFS = typeof window.showDirectoryPicker === 'function';
async function pickFolder(){
  const h = await window.showDirectoryPicker({ id:'zkp-metrics', mode:'read' });
  return h;
}
async function ensurePerm(h){
  let p = await h.queryPermission({ mode:'read' });
  if (p !== 'granted') p = await h.requestPermission({ mode:'read' });
  return p === 'granted';
}
async function findInHandles(handles, names){
  const want = new Map(Object.entries(names).map(([k, n]) => [n.toLowerCase(), k]));
  const found = {};
  for (const root of handles){
    const queue = [{ dir:root, path:root.name, depth:0 }];
    while (queue.length && Object.keys(found).length < want.size){
      const { dir, path, depth } = queue.shift(); const subs = [];
      try {
        for await (const [name, h] of dir.entries()){
          if (h.kind === 'file'){ const k = want.get(name.toLowerCase()); if (k && !found[k]) found[k] = { handle:h, path: path + '\\' + name }; }
          else if (depth < S.settings.maxDepth) subs.push({ dir:h, path: path + '\\' + name, depth: depth + 1 });
        }
      } catch (_) {}
      subs.sort((a, b) => (/dashboard/i.test(b.path) ? 1 : 0) - (/dashboard/i.test(a.path) ? 1 : 0));
      queue.push(...subs);
    }
  }
  const out = {};
  for (const k in found){ const file = await found[k].handle.getFile(); out[k] = { file, path: found[k].path }; }
  return out;
}
function pickViaInput(names){
  return new Promise((resolve, reject) => {
    const inp = $('#dirInput'); inp.value = '';
    const want = new Map(Object.entries(names).map(([k, n]) => [n.toLowerCase(), k]));
    inp.onchange = () => {
      const out = {};
      for (const f of inp.files){
        const k = want.get(f.name.toLowerCase()); if (!k) continue;
        const path = (f.webkitRelativePath || f.name).replace(/\//g, '\\');
        if (!out[k] || path.split('\\').length < out[k].path.split('\\').length) out[k] = { file:f, path };
      }
      resolve(out);
    };
    inp.oncancel = () => reject(new DOMException('cancel', 'AbortError'));
    inp.click();
  });
}

/* ======================= REFRESH ======================= */
async function refresh(opts = {}){
  const btn = $('#btnRefresh');
  if (btn.disabled) return;
  btn.disabled = true;
  const st = S.settings; let found;
  try {
    if (hasFS){
      if (!S.handles.length){ S.handles = [await pickFolder()]; await KV.set('handles', S.handles); }
      for (const h of S.handles){ const ok = opts.silent ? (await h.queryPermission({ mode:'read' })) === 'granted' : await ensurePerm(h); if (!ok) { if (opts.silent) return; throw new Error(t('permDenied')); } }
      showBusy(true);
      found = await findInHandles(S.handles, st.files);
    } else {
      if (opts.silent) return;
      found = await pickViaInput(st.files);
      showBusy(true);
    }
    const missing = Object.keys(st.files).filter(k => !found[k]).map(k => st.files[k]);
    if (missing.length) throw new Error(t('filesNotFound', { list: missing.join(', ') }));
    const texts = {}, files = [];
    for (const k of Object.keys(st.files)){
      texts[k] = await readText(found[k].file);
      files.push({ k, name: found[k].file.name, path: found[k].path, size: found[k].file.size, modified: found[k].file.lastModified });
    }
    await loadTexts(texts, files);
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    if (e && e.name === 'NotFoundError'){ S.handles = []; await KV.set('handles', []); }
    S.error = (e && e.message) || String(e);
    S.log.unshift({ ts: Date.now(), status:'error', error: S.error });
    await KV.set('log', S.log.slice(0, 200));
    renderAll();
  } finally { btn.disabled = false; showBusy(false); }
}
async function loadTexts(texts, files){
  const raw = buildRaw(texts, S.settings);
  files.forEach(f => f.rows = raw.rowCounts[f.k]);
  S.raw = { raw, files };
  const cube = buildCube(raw, S.settings, files);
  S.cube = cube; S.source = 'live'; S.error = null;
  const sig = c => JSON.stringify([c.files.map(f => [f.name, f.size, f.modified]), c.mode, c.incomeFrom, c.joinKey]);
  const last = S.snapshots[0];
  const same = last && sig(last.cube) === sig(cube);
  const k = kpis(cube, emptyFilters());
  S.log.unshift({ ts: cube.builtAt, status: same ? 'nochange' : 'ok', files: files.map(f => ({ name:f.name, path:f.path, modified:f.modified, rows:f.rows, size:f.size })),
    kpi:{ pot:k.pot, engaged:k.engaged, income:k.income, cards:k.cards, conv:k.conv }, warnings: cube.warnings.length });
  if (same) S.snapshots[0] = { id: last.id, ts: last.ts, cube };
  else S.snapshots.unshift({ id: String(cube.builtAt), ts: cube.builtAt, cube });
  S.snapshots = S.snapshots.slice(0, 40);
  await KV.set('snapshots', S.snapshots); await KV.set('log', S.log.slice(0, 200));
  pruneFilters();
  renderAll();
}
const emptyFilters = () => ({ pilot:new Set(), income:new Set(), bank:new Set() });
function pruneFilters(){
  if (!S.cube) return;
  const P = new Set(S.cube.dim.map(r => r.p)), M = new Set(S.cube.inc.map(r => r.m)), B = new Set(S.cube.dim.map(r => r.b).concat(S.cube.pot.map(r => r.b)));
  for (const v of [...S.filters.pilot]) if (!P.has(v)) S.filters.pilot.delete(v);
  for (const v of [...S.filters.income]) if (!M.has(v)) S.filters.income.delete(v);
  for (const v of [...S.filters.bank]) if (!B.has(v)) S.filters.bank.delete(v);
}

      c.files.map(f => '<tr><td>' + esc(t(fl[f.k])) + '</td><td style="font-family:Consolas,monospace">' + esc(f.path) + '</td><td class="num">' + fmtSize(f.size) + '</td><td class="num">' + esc(fmtDT(f.modified)) + '</td><td class="num">' + fmtInt(f.rows) + '</td></tr>').join('') + '</tbody></table>';
    h += '<div class="sec">' + esc(t('checks')) + '</div>';
    h += c.warnings.length ? c.warnings.map(w => { const p = Object.assign({}, w.p); if (p.s != null) p.s = fmtInt(p.s); if (p.n != null) p.n = fmtInt(p.n); return '<div class="w ' + w.lvl + '">' + esc(t(w.k, p)) + '</div>'; }).join('') : '<div class="w ok">' + esc(t('w_ok')) + '</div>';
    return h;
  });
}
function openSettings(){
  const draft = JSON.parse(JSON.stringify(S.settings));
  const body = () => {
    const mt = S.cube && S.cube.modeTotals;
    return '<div class="sec">' + esc(t('folders')) + '</div>' +
      '<div class="folders">' + (S.handles.length ? S.handles.map(h => '<div class="folder">📁 ' + esc(h.name) + '</div>').join('') : '<div class="muted">' + esc(t('noFolders')) + '</div>') + '</div>' +
      (hasFS ? '<button class="btn" data-sact="add">' + esc(t('addFolder')) + '</button> <button class="btn" data-sact="forget">' + esc(t('forgetFolders')) + '</button>' : '<div class="muted">' + esc(t('noFS')) + '</div>') +
      '<div class="muted" style="margin-top:6px">' + esc(t('foldersHint')) + '</div>' +
      '<div class="sec">' + esc(t('fileNames')) + '</div>' +
      ['pot','dim','fact'].map(k => '<div class="form-row"><label>' + esc(t('f_' + k)) + '</label><input type="text" data-f="' + k + '" value="' + esc(draft.files[k]) + '"></div>').join('') +
      '<div class="sec">' + esc(t('incomeMode')) + '</div>' +
      '<div class="form-row"><label>' + esc(t('incomeMode')) + '</label><select id="setMode">' + ['after','from','all','date'].map(m => '<option value="' + m + '"' + (draft.incomeMode === m ? ' selected' : '') + '>' + esc(t('m_' + m)) + '</option>').join('') + '</select></div>' +
      '<div class="form-row"><label>' + esc(t('incomeFrom')) + '</label><input type="month" id="setFrom" value="' + esc(draft.incomeFrom) + '"></div>' +
      (mt ? '<div class="muted">' + esc(t('modeTotals')) + '</div><div class="mt">' + ['after','from','all','date'].map(m => '<div class="' + (m === S.cube.mode ? 'cur' : '') + '">' + esc(t('m_' + m)) + '<b>' + fmtCompact(mt[m]) + '</b>' + fmtInt(mt[m]) + '</div>').join('') + '</div>' : '') +
      '<div class="form-row" style="margin-top:14px"><label>' + esc(t('joinKey')) + '</label><select id="setKey">' + ['IDENTIFYCODE','CONTRAGENTID'].map(k => '<option' + (draft.joinKey === k ? ' selected' : '') + '>' + k + '</option>').join('') + '</select></div>' +
      '<div class="sec"></div><button class="btn" data-sact="clear">' + esc(t('clearHistory')) + '</button>';
  };
  const readForm = () => {
    document.querySelectorAll('#dlgBody [data-f]').forEach(i => draft.files[i.dataset.f] = i.value.trim() || DEFAULT_SETTINGS.files[i.dataset.f]);
    const m = $('#setMode'); if (m) draft.incomeMode = m.value;
    const fr = $('#setFrom'); if (fr && fr.value) draft.incomeFrom = fr.value;
    const k = $('#setKey'); if (k) draft.joinKey = k.value;
  };
  openDialog(t('settingsTitle'), body, '<button class="btn" data-act="close">' + esc(t('cancel')) + '</button><button class="btn primary" data-act="save">' + esc(t('save')) + '</button>', async a => {
    if (a !== 'save') return;
    readForm();
    const needRaw = JSON.stringify(draft.files) !== JSON.stringify(S.settings.files);
    S.settings = draft; localStorage.setItem('zkp:settings', JSON.stringify(draft));
    $('#dlg').close();
    if (S.raw && !needRaw){
      try {
        S.cube = buildCube(S.raw.raw, draft, S.raw.files); S.source = 'live'; pruneFilters(); renderAll(); return;
      } catch (e) {}
    }
    alert(t('needRefresh'));
  });
  $('#dlgBody').onclick = async e => {
    const a = e.target.dataset.sact; if (!a) return;
    readForm();
    if (a === 'add'){ try { const h = await pickFolder(); S.handles.push(h); await KV.set('handles', S.handles); } catch (_) {} }
    if (a === 'forget'){ S.handles = []; await KV.set('handles', []); }
    if (a === 'clear' && confirm(t('confirmClear'))){ S.log = []; S.snapshots = S.cube ? [{ id:String(S.cube.builtAt), ts:S.cube.builtAt, cube:S.cube }] : []; S.compareId = ''; await KV.set('log', []); await KV.set('snapshots', S.snapshots); renderAll(); }
    $('#dlgBody').innerHTML = body();
  };
}

/* ======================= EXPORT ======================= */
async function snapshotCanvas(){
  return html2canvas($('#app'), { scale:2, backgroundColor:'#f4f6f2', ignoreElements: el => el.hasAttribute && el.hasAttribute('data-noexport') });
}
const stamp = () => new Date().toISOString().slice(0, 16).replace('T', '_').replace(':', '-');
async function exportPng(){
  try { showBusy(true); const cv = await snapshotCanvas();
    cv.toBlob(b => { const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'ZKP_dashboard_' + stamp() + '.png'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000); });
  } catch (e) { alert(t('exportFail', { e: e.message })); } finally { showBusy(false); }
}
async function exportPdf(){
  try { showBusy(true); const cv = await snapshotCanvas(); const img = $('#printImg'); img.src = cv.toDataURL('image/png'); await img.decode();
    showBusy(false); const old = document.title; document.title = 'ZKP_dashboard_' + stamp(); window.print(); document.title = old;
  } catch (e) { alert(t('exportFail', { e: e.message })); } finally { showBusy(false); }
}

/* ======================= EVENTS ======================= */
$('#btnRefresh').onclick = () => refresh();
$('#btnLang').onclick = () => { S.lang = S.lang === 'uk' ? 'en' : 'uk'; localStorage.setItem('zkp:lang', S.lang); renderAll(); };
$('#btnReset').onclick = () => { Object.values(S.filters).forEach(s => s.clear()); renderAll(); };
$('#btnLog').onclick = () => openLog();
$('#verLink').onclick = () => openLog('versions');
$('#btnData').onclick = openData;
$('#btnSettings').onclick = openSettings;
$('#btnPng').onclick = exportPng;
$('#btnPdf').onclick = exportPdf;
$('#compareSel').onchange = e => { S.compareId = e.target.value; localStorage.setItem('zkp:compare', S.compareId); renderAll(); };
document.querySelector('.sidebar').addEventListener('change', e => {
  const i = e.target; if (!i.dataset.dim) return;
  const set = S.filters[i.dataset.dim]; i.checked ? set.add(i.value) : set.delete(i.value); renderAll();
});
document.querySelector('.sidebar').addEventListener('click', e => {
  if (e.target.classList.contains('slicer-clear')){ S.filters[e.target.closest('.slicer').dataset.dim].clear(); renderAll(); }
});
$('#chips').addEventListener('click', e => { const d = e.target.dataset.clear; if (d){ S.filters[d].clear(); renderAll(); } });

/* ======================= INIT ======================= */
(async function init(){
  try { const s = JSON.parse(localStorage.getItem('zkp:settings') || 'null'); if (s) S.settings = Object.assign({}, DEFAULT_SETTINGS, s, { files: Object.assign({}, DEFAULT_SETTINGS.files, s.files || {}) }); } catch (_) {}
  S.compareId = localStorage.getItem('zkp:compare') || '';
  makeCharts();
  S.snapshots = (await KV.get('snapshots')) || [];
  S.log = (await KV.get('log')) || [];
  if (hasFS) S.handles = ((await KV.get('handles')) || []).filter(h => h && typeof h.queryPermission === 'function');
  if (S.snapshots.length){ S.cube = S.snapshots[0].cube; S.source = 'snapshot'; }
  renderAll();
  if (S.handles.length) refresh({ silent:true });
})();
window.ZKP = { loadTexts, S };
</script>
</body>
